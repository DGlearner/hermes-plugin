services:
  gateway:
    restart: unless-stopped
    stop_grace_period: 90s
    command:
      - python
      - -m
      - uvicorn
      - wechat_provisioner.app:create_app
      - --factory
      - --host=100.104.30.119
      - --port=8788
      - --workers=1
      - --no-access-log
    environment:
      TZ: Asia/Shanghai
      HERMES_EMPLOYEE_TEMPLATE_PROFILE: employee-template
      HERMES_WECHAT_PROVISIONER_ALLOWED_CIDRS: 127.0.0.0/8,::1/128,100.64.0.0/10
      HERMES_WECHAT_PROVISIONER_RESTART_TIMEOUT_SECONDS: "20"
      HERMES_WECHAT_PROVISIONER_TOKEN_FILE: /run/secrets/wechat_provisioner_token
      PROFILE_RAG_MCP_MAX_PENDING_PAIRINGS: "100"
      PROFILE_RAG_MCP_ATTACHMENT_ROOTS: /opt/data/cache/documents
      PROFILE_RAG_MCP_ATTACHMENT_MAX_BYTES: "26214400"
      PROFILE_RAG_MCP_ATTACHMENT_BATCH_MAX_FILES: "5"
      PROFILE_RAG_MCP_ATTACHMENT_SESSION_MAX_FILES: "10"
      PROFILE_RAG_MCP_ATTACHMENT_SESSION_MAX_BYTES: "209715200"
      PROFILE_RAG_MCP_ATTACHMENT_PROFILE_MAX_BYTES: "314572800"
      PROFILE_RAG_MCP_ATTACHMENT_GLOBAL_MAX_BYTES: "10737418240"
      PROFILE_RAG_MCP_ATTACHMENT_CLEANUP_PERCENT: "70"
      PROFILE_RAG_MCP_ATTACHMENT_REJECT_PERCENT: "85"
      PROFILE_RAG_MCP_ATTACHMENT_UNPROCESSED_TTL_SECONDS: "1800"
      PROFILE_RAG_MCP_ATTACHMENT_ANALYZED_IDLE_TTL_SECONDS: "3600"
      PROFILE_RAG_MCP_ATTACHMENT_HARD_TTL_SECONDS: "14400"
      PROFILE_RAG_MCP_ATTACHMENT_CLEANUP_INTERVAL_SECONDS: "600"
      PROFILE_RAG_MCP_ATTACHMENT_METRICS_FILE: /opt/data/state/profile-rag-mcp-attachment-cache.json
    env_file:
      - /home/kozy/project/hermes-shared-model.env
    volumes:
      - /home/kozy/project/hermes-profile-rag-mcp/wechat_provisioner:/opt/hermes/wechat_provisioner:ro
      - /home/kozy/project/hermes-wechat-provisioner.token:/run/secrets/wechat_provisioner_token:ro
      - /home/kozy/project/hermes-cache:/opt/data/cache
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://100.104.30.119:8788/livez', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
